# SỬA LỖI: Dùng 'fastcgi_cache_path', KHÔNG PHẢI 'proxy_cache_path'
fastcgi_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=10g inactive=60m use_temp_path=off;

server {
    listen 80;

    location / {
        # Thêm header để ta biết cache HIT hay MISS
        add_header X-Cache-Status $upstream_cache_status;

        # Bật cache (Giữ nguyên)
        fastcgi_cache my_cache;
        fastcgi_cache_valid 200 1m; 
        fastcgi_cache_key "$scheme$proxy_host$request_uri";

        # Chỉ định file script (Giữ nguyên)
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param SCRIPT_NAME /index.php; 
        
        # Chuyển tiếp request đến backend PHP-FPM (Giữ nguyên)
        fastcgi_pass app:9000;
    }
}